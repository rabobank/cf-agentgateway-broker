---
releases:
- name: bosh-dns-aliases
  version: 0.0.4
addons:
- name: agentgateway-aliases
  include:
    deployments: [cf]
  jobs:
  - name: bosh-dns-aliases
    release: bosh-dns-aliases
    properties:
      aliases:
      - domain: gateway.agentgateway.internal
        targets:
        - query: '*'
          instance_group: gateway
          deployment: agentgateway-broker
          network: default
          domain: bosh
      - domain: broker.agentgateway.internal
        targets:
        - query: '*'
          instance_group: broker
          deployment: agentgateway-broker
          network: default
          domain: bosh
