---
name: agentgateway-broker
releases:
- name: agentgateway-broker
  version: latest
- name: bpm
  version: 1.4.41
- name: postgres
  version: 57.0.0
- name: bosh-dns
  version: 1.39.30
- name: bosh-dns-aliases
  version: 0.0.4
stemcells:
- alias: default
  os: ubuntu-noble
  version: '1.562'
instance_groups:
- name: broker
  instances: 1
  azs: [z1]
  vm_type: default
  stemcell: default
  persistent_disk_type: 10GB
  networks:
  - name: default
  jobs:
  - name: bosh-dns
    release: bosh-dns
    properties: &dns-properties
      override_nameserver: false
      configure_systemd_resolved: true
      disable_recursors: true
      api:
        client:
          tls:
            ca: ((dns_api_client.ca))
            certificate: ((dns_api_client.certificate))
            private_key: ((dns_api_client.private_key))
        server:
          tls:
            ca: ((dns_api_server.ca))
            certificate: ((dns_api_server.certificate))
            private_key: ((dns_api_server.private_key))
  - name: bosh-dns-aliases
    release: bosh-dns-aliases
    properties:
      aliases: &aliases
      - domain: gateway.agentgateway.internal
        targets:
        - {query: '*', instance_group: gateway, deployment: agentgateway-broker, network: default, domain: bosh}
      - domain: broker.agentgateway.internal
        targets:
        - {query: '*', instance_group: broker, deployment: agentgateway-broker, network: default, domain: bosh}
  - name: bpm
    release: bpm
  - name: postgres
    release: postgres
    provides:
      postgres: {as: agentgateway-db}
    properties:
      databases:
        version: 18
        databases:
        - name: agentgateway
        roles:
        - name: agentgateway
          password: ((postgres_password))
          permissions: [SUPERUSER]
  - name: agentgateway-broker
    release: agentgateway-broker
    properties:
      broker:
        gateway_url: https://gateway.agentgateway.internal:8443/v1
        management_url: https://gateway.agentgateway.internal:8444
        management_token: ((management_token))
        password: ((broker_password))
        models: ((model_aliases))
        budget: ((usd_allowance))
        window: ((budget_window))
        tls:
          certificate: ((broker_tls.certificate))
          private_key: ((broker_tls.private_key))
          ca: ((gateway_tls.ca))
- name: gateway
  instances: 2
  azs: [z1, z2]
  vm_type: default
  stemcell: default
  networks:
  - name: default
  jobs:
  - name: bosh-dns
    release: bosh-dns
    properties: *dns-properties
  - name: bosh-dns-aliases
    release: bosh-dns-aliases
    properties:
      aliases: *aliases
  - name: bpm
    release: bpm
  - name: agentgateway
    release: agentgateway-broker
    consumes:
      postgres: {from: agentgateway-db}
    properties:
      gateway:
        management_token: ((management_token))
        database:
          password: ((postgres_password))
        models: ((gateway_models))
        catalog: ((model_catalog))
        tls:
          certificate: ((gateway_tls.certificate))
          private_key: ((gateway_tls.private_key))
variables:
- name: dns_api_ca
  type: certificate
  options: {is_ca: true, common_name: dns-api-ca}
- name: dns_api_client
  type: certificate
  options:
    ca: dns_api_ca
    common_name: dns-api-client
    extended_key_usage: [client_auth]
- name: dns_api_server
  type: certificate
  options:
    ca: dns_api_ca
    common_name: dns-api-server
    alternative_names: [localhost, 127.0.0.1]
    extended_key_usage: [server_auth]
- name: broker_password
  type: password
- name: management_token
  type: password
- name: postgres_password
  type: password
- name: gateway_ca
  type: certificate
  options: {is_ca: true, common_name: agentgateway-ca}
- name: gateway_tls
  type: certificate
  options:
    ca: gateway_ca
    common_name: gateway.agentgateway.internal
    alternative_names: [gateway.agentgateway.internal]
- name: broker_tls
  type: certificate
  options:
    ca: gateway_ca
    common_name: broker.agentgateway.internal
    alternative_names: [broker.agentgateway.internal]
update:
  canaries: 1
  max_in_flight: 1
  canary_watch_time: 1000-60000
  update_watch_time: 1000-60000
