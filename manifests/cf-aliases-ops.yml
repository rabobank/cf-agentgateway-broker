---
- type: replace
  path: /addons/name=bosh-dns-aliases/jobs/name=bosh-dns-aliases/properties/aliases/-
  value:
    domain: gateway.agentgateway.internal
    targets:
    - {query: '*', instance_group: gateway, deployment: agentgateway-broker, network: default, domain: bosh}
- type: replace
  path: /addons/name=bosh-dns-aliases/jobs/name=bosh-dns-aliases/properties/aliases/-
  value:
    domain: broker.agentgateway.internal
    targets:
    - {query: '*', instance_group: broker, deployment: agentgateway-broker, network: default, domain: bosh}
