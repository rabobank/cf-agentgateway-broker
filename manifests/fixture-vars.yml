# Startup/compilation fixture only: upstream inference is deliberately unavailable.
model_aliases: [fixture-model]
usd_allowance: 3
budget_window: 24h
gateway_models:
- name: fixture-model
  provider: openAI
  params:
    model: fixture-model
    apiKey: fixture-provider-key
    baseUrl: http://127.0.0.1:19999/v1
model_catalog:
  providers:
    openai:
      models:
        fixture-model:
          rates: {input: '1000000', output: '1000000'}
