---
applications:
- name: ((gateway_app_name))
  path: dist/gateway
  buildpacks: [((buildpack))]
  command: exec ./bin/launcher
  memory: ((gateway_memory))
  disk_quota: ((gateway_disk_quota))
  instances: ((gateway_instances))
  sidecars:
  - name: capsule-extmcp
    process_types: [web]
    command: exec ./bin/capsule-extmcp
    memory: 128M
  health-check-type: port
  routes:
  - route: ((gateway_route))
  services: [((database_service_name))]
  env:
    APP_ROLE: gateway
    RUST_MIN_STACK: "16777216"
    AGENTGATEWAY_CONFIG: ((gateway_config))
- name: ((broker_app_name))
  path: dist/broker
  buildpacks: [((buildpack))]
  command: exec ./bin/launcher
  memory: ((broker_memory))
  disk_quota: ((broker_disk_quota))
  instances: ((broker_instances))
  routes:
  - route: ((broker_route))
  env:
    APP_ROLE: broker
    AGENTGATEWAY_CONFIG: ((broker_config))
