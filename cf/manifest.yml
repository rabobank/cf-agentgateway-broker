---
applications:
- name: ((gateway_app_name))
  path: dist/gateway
  stack: ((stack))
  buildpacks: [((buildpack))]
  command: exec ./bin/launcher
  memory: ((gateway_memory))
  disk_quota: ((gateway_disk_quota))
  instances: ((gateway_instances))
  health-check-type: port
  routes:
  - route: ((gateway_route))
  services: [((database_service_name))]
  env:
    APP_ROLE: gateway
    DATABASE_SERVICE_NAME: ((database_service_name))
    MANAGEMENT_TOKEN: ((management_token))
    GATEWAY_MODELS: ((gateway_models))
    MODEL_CATALOG: ((model_catalog))
- name: ((broker_app_name))
  path: dist/broker
  stack: ((stack))
  buildpacks: [((buildpack))]
  command: exec ./bin/launcher
  memory: ((broker_memory))
  disk_quota: ((broker_disk_quota))
  instances: ((broker_instances))
  routes:
  - route: ((broker_route))
  env:
    APP_ROLE: broker
    BROKER_PASSWORD: ((broker_password))
    INSTALLATION: ((installation))
    MANAGEMENT_URL: ((management_url))
    MANAGEMENT_TOKEN: ((management_token))
    GATEWAY_URL: ((gateway_url))
    GATEWAY_TRUSTED_CA: ((trusted_ca))
    MODEL_ALIASES: ((model_aliases))
    USD_ALLOWANCE: ((usd_allowance))
    BUDGET_WINDOW: ((budget_window))
