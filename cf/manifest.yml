---
applications:
- name: agentgateway
  path: dist/gateway
  stack: cflinuxfs5
  buildpacks: [binary_buildpack]
  command: exec ./bin/launcher
  memory: 768M
  disk_quota: 1G
  instances: 2
  health-check-type: port
  routes:
  - route: agentgateway.((domain))
  services: [agentgateway-state]
  env:
    APP_ROLE: gateway
    MANAGEMENT_TOKEN: ((management_token))
    GATEWAY_MODELS: ((gateway_models))
    MODEL_CATALOG: ((model_catalog))
- name: agentgateway-broker
  path: dist/broker
  stack: cflinuxfs5
  buildpacks: [binary_buildpack]
  command: exec ./bin/launcher
  memory: 128M
  instances: 1
  routes:
  - route: agentgateway-broker.((domain))
  env:
    APP_ROLE: broker
    BROKER_PASSWORD: ((broker_password))
    INSTALLATION: cf-agentgateway
    MANAGEMENT_URL: http://agentgateway-management.apps.internal:9090
    MANAGEMENT_TOKEN: ((management_token))
    GATEWAY_URL: https://agentgateway.((domain))/v1
    GATEWAY_TRUSTED_CA: ((trusted_ca))
    MODEL_ALIASES: deepseek-v4-flash
    USD_ALLOWANCE: '10'
    BUDGET_WINDOW: 24h
