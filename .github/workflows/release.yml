name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release version and branch
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo 'Run releases from the default branch.' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Version must be a stable semantic version such as v1.2.3.' >&2
            exit 1
          fi
      - name: Check release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject an existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            echo "Tag ${VERSION} already exists." >&2
            exit 1
          fi

  acceptance:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/acceptance.yml
    with:
      ref: ${{ github.sha }}
      publish-build: true

  publish:
    needs: acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-cf-bundles
          path: release-bundles

      - name: Verify release asset checksums
        working-directory: release-bundles
        run: |
          test -f cf-agentgateway-broker-linux-amd64.tar.gz
          sha256sum --check SHA256SUMS
          sha256sum --check cf-agentgateway-SHA256SUMS

      # Creating the ref explicitly is atomic: a concurrent tag creation fails
      # rather than silently publishing the tested bundle against another SHA.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          notes=$(cat <<'EOF'
          ## Install the `cf ag` plugin

          With the Cloud Foundry CLI v8 installed, paste this into a Bash or Zsh terminal on Linux (x86-64 or ARM64) or macOS (Apple Silicon):

          ```bash
          (
            set -eu
            case "$(uname -s):$(uname -m)" in
              Linux:x86_64) asset=cf-agentgateway-linux-amd64 ;;
              Linux:aarch64|Linux:arm64) asset=cf-agentgateway-linux-arm64 ;;
              Darwin:arm64) asset=cf-agentgateway-darwin-arm64 ;;
              *) printf 'No cf ag binary for this platform.\n' >&2; exit 1 ;;
            esac

            base_url='@DOWNLOAD_URL@'
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            cd "$tmp_dir"
            curl -fsSL "$base_url/$asset" -o "$asset"
            curl -fsSL "$base_url/cf-agentgateway-SHA256SUMS" -o cf-agentgateway-SHA256SUMS
            awk -v asset="$asset" '$2 == asset' cf-agentgateway-SHA256SUMS > "$asset.sha256"
            test -s "$asset.sha256"
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 -c "$asset.sha256"
            else
              sha256sum -c "$asset.sha256"
            fi
            chmod +x "$asset"
            cf install-plugin -f "./$asset"
          )
          ```

          This replaces any installed `agentgateway` plugin. Run `cf ag help` to see the available commands.
          EOF
          )
          download_url="${GITHUB_SERVER_URL}/${REPOSITORY}/releases/download/${VERSION}"
          notes=${notes//@DOWNLOAD_URL@/$download_url}
          gh api --method POST "repos/${REPOSITORY}/git/refs" -f "ref=refs/tags/${VERSION}" -f "sha=${COMMIT}"
          gh release create "$VERSION" \
            release-bundles/cf-agentgateway-broker-linux-amd64.tar.gz release-bundles/SHA256SUMS \
            release-bundles/cf-agentgateway-{linux-amd64,linux-arm64,darwin-arm64,SHA256SUMS} \
            --repo "$REPOSITORY" --verify-tag --title "$VERSION" --generate-notes --notes "$notes"
