name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release version and branch
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo 'Run releases from the default branch.' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Version must be a stable semantic version such as v1.2.3.' >&2
            exit 1
          fi
      - name: Check release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject an existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            echo "Tag ${VERSION} already exists." >&2
            exit 1
          fi

  acceptance:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/acceptance.yml
    with:
      ref: ${{ github.sha }}
      publish-build: true

  publish:
    needs: acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested deployment bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-cf-bundles
          path: release-bundles

      - name: Verify bundle checksums
        working-directory: release-bundles
        run: |
          test -f agentgateway-linux-amd64.tar.gz
          test -f agentgateway-broker-linux-amd64.tar.gz
          sha256sum --check SHA256SUMS

      # Creating the ref explicitly is atomic: a concurrent tag creation fails
      # rather than silently publishing the tested bundles against another SHA.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          gh api --method POST "repos/${REPOSITORY}/git/refs" -f "ref=refs/tags/${VERSION}" -f "sha=${COMMIT}"
          gh release create "$VERSION" release-bundles/*.tar.gz release-bundles/SHA256SUMS \
            --repo "$REPOSITORY" --verify-tag --title "$VERSION" --generate-notes
