name: Acceptance

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Candidate commit to build and test
        required: false
        type: string
      publish-build:
        description: Upload the acceptance-tested deployment bundle
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: 0.17.5

      - name: Vendor Rust dependencies
        run: devbox run vendor

      - name: Build application binaries
        run: devbox run build

      - name: Run unit and PostgreSQL contract tests
        env:
          TEST_REPORT_DIR: ${{ runner.temp }}/acceptance-reports/capsules
        run: devbox run test

      - name: Verify generated Counterfeiter fakes
        run: |
          devbox run -- env GOTOOLCHAIN=go1.27.0 go -C src/capsule-extmcp generate ./plugin
          git diff --exit-code -- src/capsule-extmcp/plugin/pluginfakes

      # The gateway launcher uses fixed management ports, so this suite must
      # run serially rather than using Ginkgo's parallel processes.
      - name: Run acceptance tests
        run: >-
          devbox run -- go -C acceptance run github.com/onsi/ginkgo/v2/ginkgo
          --randomize-all --fail-on-pending --fail-on-empty --trace
          --github-output --force-newlines --no-color
          --json-report=acceptance.json --junit-report=acceptance.xml
          --output-dir="${RUNNER_TEMP}/acceptance-reports"
          --timeout=10m --poll-progress-after=2m --poll-progress-interval=30s

      - name: Package tested deployment bundle
        if: inputs.publish-build
        run: |
          mkdir -p "$RUNNER_TEMP/release-bundles"
          tar -czf "$RUNNER_TEMP/release-bundles/cf-agentgateway-broker-linux-amd64.tar.gz" \
            --transform='s|^cf/README.md$|README.md|' \
            --transform='s|^cf/manifest.yml$|manifest.yml|' \
            --transform='s|^cf/dev-vars.yml$|dev-vars.yml|' \
            --transform='s|^cf/dist/|dist/|' \
            cf/README.md cf/manifest.yml cf/dev-vars.yml \
            cf/dist/gateway/bin cf/dist/gateway/lib cf/dist/broker/bin
          cd "$RUNNER_TEMP/release-bundles"
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Upload tested deployment bundle
        if: inputs.publish-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-cf-bundles
          path: ${{ runner.temp }}/release-bundles/
          if-no-files-found: error
          retention-days: 7

      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-reports
          path: ${{ runner.temp }}/acceptance-reports/
          if-no-files-found: ignore
          retention-days: 7
