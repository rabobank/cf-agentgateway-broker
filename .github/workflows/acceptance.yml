name: Acceptance

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Candidate commit to build and test
        required: false
        type: string
      publish-build:
        description: Upload the acceptance-tested deployment bundle
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: 0.17.5

      - name: Vendor Rust dependencies
        run: devbox run vendor

      - name: Compute Rust build cache keys
        id: rust-cache-key
        shell: bash
        run: |
          source scripts/agentgateway-version
          # Keep the compiler/container and build recipe isolated, but allow
          # Cargo to reuse dependencies across gateway source revisions.
          recipe=$(sha256sum scripts/build | cut -d ' ' -f 1)
          lock=$(sha256sum src/agentgateway/Cargo.lock | cut -d ' ' -f 1)
          image=$(printf '%s' "$RUST_IMAGE" | sha256sum | cut -d ' ' -f 1)
          prefix="rust-release-v1-${RUNNER_OS}-${RUNNER_ARCH}-${RUST_VERSION}-${image}-${recipe}"
          {
            echo "key=${prefix}-${lock}-${AGENTGATEWAY_REVISION}"
            echo "restore-prefix=${prefix}-${lock}-"
            echo "dependency-prefix=${prefix}-"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Rust release build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/cf-build-target-lowmem/release
          key: ${{ steps.rust-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.rust-cache-key.outputs.restore-prefix }}
            ${{ steps.rust-cache-key.outputs.dependency-prefix }}

      - name: Build application binaries
        run: devbox run build

      # Docker builds as root. The runner must be able to archive all target
      # files, including when a later acceptance step fails.
      - name: Prepare Rust cache ownership
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" src/cf-build-target-lowmem/release

      - name: Save Rust release build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/cf-build-target-lowmem/release
          key: ${{ steps.rust-cache-key.outputs.key }}

      # Image download/extraction is setup, not part of gateway readiness.
      - name: Prepare acceptance runtime image
        timeout-minutes: 5
        run: docker pull ghcr.io/cloudfoundry/k8s/cflinuxfs5:latest

      - name: Run unit and PostgreSQL contract tests
        env:
          TEST_REPORT_DIR: ${{ runner.temp }}/acceptance-reports/capsules
        run: devbox run test

      - name: Verify generated Counterfeiter fakes
        run: |
          devbox run -- env GOTOOLCHAIN=go1.27.0 go -C src/capsule-extmcp generate ./plugin
          git diff --exit-code -- src/capsule-extmcp/plugin/pluginfakes

      # The gateway launcher uses fixed management ports, so this suite must
      # run serially rather than using Ginkgo's parallel processes.
      - name: Install CF CLI for plugin acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.19.0 --repo cloudfoundry/cli --pattern cf8-cli_8.19.0_linux_x86-64.tgz --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/cf-cli"
          tar -xzf "$RUNNER_TEMP/cf8-cli_8.19.0_linux_x86-64.tgz" -C "$RUNNER_TEMP/cf-cli"
          ln -sf "$RUNNER_TEMP/cf-cli/cf8" "$RUNNER_TEMP/cf-cli/cf"
          echo "$RUNNER_TEMP/cf-cli" >> "$GITHUB_PATH"

      - name: Run acceptance tests
        env:
          REQUIRE_CF_CLI: "true"
        run: >-
          devbox run -- go -C acceptance run github.com/onsi/ginkgo/v2/ginkgo
          --randomize-all --fail-on-pending --fail-on-empty --trace
          --github-output --force-newlines --no-color
          --json-report=acceptance.json --junit-report=acceptance.xml
          --output-dir="${RUNNER_TEMP}/acceptance-reports"
          --timeout=10m --poll-progress-after=2m --poll-progress-interval=30s

      - name: Package tested deployment bundle
        if: inputs.publish-build
        run: |
          mkdir -p "$RUNNER_TEMP/release-bundles"
          tar -czf "$RUNNER_TEMP/release-bundles/cf-agentgateway-broker-linux-amd64.tar.gz" \
            --transform='s|^cf/README.md$|README.md|' \
            --transform='s|^cf/configuration.md$|configuration.md|' \
            --transform='s|^cf/manifest.yml$|manifest.yml|' \
            --transform='s|^cf/dev-vars.yml$|dev-vars.yml|' \
            --transform='s|^cf/deploy$|deploy|' \
            --transform='s|^cf/config-vars$|config-vars|' \
            --transform='s|^cf/broker.example.yml$|broker.example.yml|' \
            --transform='s|^cf/gateway.example.yml$|gateway.example.yml|' \
            --transform='s|^cf/deployment.example.yml$|deployment.example.yml|' \
            --transform='s|^cf/dist/|dist/|' \
            cf/README.md cf/configuration.md cf/manifest.yml cf/dev-vars.yml cf/deploy \
            cf/config-vars cf/broker.example.yml cf/gateway.example.yml cf/deployment.example.yml \
            cf/dist/gateway/bin cf/dist/gateway/lib cf/dist/broker/bin cf/dist/cf-agentgateway
          cd "$RUNNER_TEMP/release-bundles"
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Package CF CLI plugin release assets
        if: inputs.publish-build
        run: |
          assets="$RUNNER_TEMP/release-bundles"
          cp cf/dist/cf-agentgateway "$assets/cf-agentgateway-linux-amd64"
          for os in linux darwin; do
            devbox run -- env GOTOOLCHAIN=go1.27.0 CGO_ENABLED=0 GOOS="$os" GOARCH=arm64 \
              go -C src/cf-agentgateway build -trimpath -o "$assets/cf-agentgateway-$os-arm64" .
          done
          cd "$assets"
          sha256sum cf-agentgateway-linux-amd64 cf-agentgateway-linux-arm64 cf-agentgateway-darwin-arm64 > cf-agentgateway-SHA256SUMS

      - name: Upload tested deployment bundle
        if: inputs.publish-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-cf-bundles
          path: ${{ runner.temp }}/release-bundles/
          if-no-files-found: error
          retention-days: 7

      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-reports
          path: ${{ runner.temp }}/acceptance-reports/
          if-no-files-found: ignore
          retention-days: 7
